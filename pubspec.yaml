name: pos_tipo_eleventa
description: POS completo tipo Eleventa | Colombia
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Base datos local
  sqflite: ^2.4.1
  path: ^1.9.0
  # Formato moneda/fechas
  intl: ^0.19.0
  # Lector códigos barras / QR cámara
  mobile_scanner: ^6.0.2
  # Impresora térmica Bluetooth
  esc_pos_bluetooth: ^0.4.1
  flutter_bluetooth_serial: ^0.4.0
  # NUBE + USUARIOS
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0
  # Preferencias / sesión
  shared_preferences: ^2.3.2
  # PDF / Excel
  pdf: ^3.11.1
  excel: ^4.0.3
  # Cifrado datos DIAN
  crypto: ^3.0.6

flutter:
  uses-material-design: true
